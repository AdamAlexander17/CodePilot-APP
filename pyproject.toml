[project]
name = "codepilot"
version = "0.1.0"
description = "AI software engineering and debugging agent platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncmy>=0.2.15",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "langchain-core>=1.6.6",
    "langchain-mcp-adapters>=0.3.1",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.12",
    "mcp>=2.2.0",
    "ollama>=0.6.3",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pymysql>=1.2.3",
    "sqlalchemy[asyncio]>=2.1.0",
    "sqlparse>=0.6.0",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codepilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
